<button onclick="unlock()">Enter</button>

<!-- JavaScript: what happens when clicked -->
<script>

function unlock() {
  const code = document.getElementById("passcode").value;

  if (code === "BLUE123") {
    window.location.href = "document-a.pdf";
  } else if (code === "PINK456") {
    window.location.href = "document-b.pdf";
  } else {
    document.getElementById("message").textContent =
      "Incorrect passcode. Try again.";
  }
}
